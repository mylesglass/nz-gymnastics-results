services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/results.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node:/app/node_modules
    depends_on:
      - backend
    environment:
      - PUBLIC_API_URL=http://localhost:8000
      - PROXY_TARGET=http://backend:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  backend_data:
  frontend_node: